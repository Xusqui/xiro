version: '3.8'

networks:
  xiro_internal:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    container_name: xiro_postgres
    restart: unless-stopped
    mem_limit: 8g
    networks:
      - xiro_internal
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_db_password}
      POSTGRES_DB: ${DB_NAME:-xiro_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=es_ES.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -p 5439"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres -c listen_addresses=* -c port=5439
      -c max_connections=100

  redis:
    image: redis:8.4.0-alpine
    container_name: xiro_redis
    restart: unless-stopped
    user: "999"
    mem_limit: 512m
    networks:
      - xiro_internal
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_password}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-changeme_redis_password}
    volumes:
      - redis_socket:/var/run/redis
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -s /var/run/redis/redis.sock -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    # IMPORTANTE: Reemplaza con tu usuario y nombre de repositorio en Docker Hub / Registry
    image: tunombredeusuario/xiro:latest
    container_name: xiro_backend
    restart: unless-stopped
    mem_limit: 4g
    read_only: true
    tmpfs:
      - /tmp:size=100M
    init: true
    networks:
      - xiro_internal
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Volúmenes para mantener persistencia entre reinicios (subidas de usuarios y logs)
      - xiro_uploads:/usr/src/app/public/uploads
      - xiro_logs:/usr/src/app/logs
      - redis_socket:/var/run/redis
    # El entorno se carga desde el archivo .env configurado en Portainer, o desde las variables.
    env_file:
      - .env
    environment:
      PORT: ${APP_PORT:-3000}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_db_password}
      DB_HOST: db
      DB_PORT: 5439
      DB_NAME: ${DB_NAME:-xiro_db}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_password}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  redis_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=999,gid=999,mode=0770"
  xiro_uploads:
  xiro_logs:
