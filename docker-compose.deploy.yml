# =====================================================================
# Xiro! — despliegue en un servidor público CON Caddy (opción A del README)
#
# Para un VPS o servidor sin proxy inverso delante: el contenedor «caddy»
# ocupa los puertos 80 y 443 y obtiene el certificado HTTPS él solo.
# Cambia «xiro.pro» por tu dominio en el servicio caddy (al final).
#
# ¿Ya tienes tu propio proxy inverso (NAS Synology/QNAP, nginx, Nginx Proxy
# Manager…)? Usa docker-compose.deploy.nas.yml (opción B del README).
#
# Copia este fichero como docker-compose.yml junto al .env.
# =====================================================================

networks:
  xiro_internal:
    driver: bridge

services:
  # Crea las contraseñas y claves la primera vez (volumen xiro_secrets) y no las toca después.
  # Si ya tenías DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET o UPDATER_TOKEN en el .env, usa esos valores.
  secrets:
    image: xusqui/xiro-backend:latest
    container_name: xiro_secrets
    user: "0:0"
    working_dir: /usr/src/app
    command: ["node", "scripts/generate-secrets.js"]
    restart: "no"
    networks:
      - xiro_internal
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - xiro_secrets:/secrets

  db:
    image: postgres:15-alpine
    container_name: xiro_postgres
    restart: unless-stopped
    mem_limit: 1500m
    networks:
      - xiro_internal
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /secrets/db_password
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=es_ES.UTF-8"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - xiro_secrets:/secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine
    container_name: xiro_redis
    restart: unless-stopped
    networks:
      - xiro_internal
    volumes:
      - ./redis_data:/data
      - xiro_secrets:/secrets:ro
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$(cat /secrets/redis_password)"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /secrets/redis_password)\" redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      secrets:
        condition: service_completed_successfully

  chrome:
    image: browserless/chrome:latest
    container_name: xiro_chrome
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - xiro_internal
    environment:
      - MAX_CONCURRENT_SESSIONS=5
      - CONNECTION_TIMEOUT=60000

  backend:
    image: xusqui/xiro-backend:latest
    container_name: xiro_backend
    restart: unless-stopped
    mem_limit: 1500m
    networks:
      - xiro_internal
    # ports:
    #   - "80:3000"
    volumes:
      - ./public/uploads:/usr/src/app/public/uploads
      - ./public/images/personalizations:/usr/src/app/public/images/personalizations
      - ./logs:/usr/src/app/logs
      - ./config/ui-overrides.json:/usr/src/app/config/ui-overrides.json
      - ./config/runtime-overrides.json:/usr/src/app/config/runtime-overrides.json
      - ./config/groq-key.json:/usr/src/app/ai-generator/groq-key.json:rw
      - /etc/machine-id:/host/machine-id:ro
      - xiro_secrets:/secrets:ro
    environment:
      MACHINE_ID_PATH: /host/machine-id
      CHROME_WS_ENDPOINT: ws://chrome:3000
      UPDATER_URL: http://updater:8080
      JWT_SECRET_FILE: /secrets/jwt_secret
      DB_PASSWORD_FILE: /secrets/db_password
      REDIS_PASSWORD_FILE: /secrets/redis_password
      UPDATER_TOKEN_FILE: /secrets/updater_token
    env_file: .env
    depends_on:
      secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chrome:
        condition: service_started

  backup:
    image: xusqui/xiro-backup:latest
    container_name: xiro_backup
    restart: unless-stopped
    networks:
      - xiro_internal
    env_file: .env
    environment:
      DB_PASSWORD_FILE: /secrets/db_password
    volumes:
      - ./backups:/backups
      - ./config:/app-config:ro
      - ./logs:/app/logs
      - xiro_secrets:/secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # Actualizador: descarga e instala versiones nuevas desde el panel (Configuración → Actualizaciones).
  # Tiene el socket de Docker, así que no publica puertos: solo lo alcanza el backend por la red interna,
  # autenticado con el token del volumen xiro_secrets. Solo actualiza backend y backup.
  updater:
    image: xusqui/xiro-updater:latest
    container_name: xiro_updater
    restart: unless-stopped
    networks:
      - xiro_internal
    command:
      - sh
      - -c
      - export UPDATER_TOKEN="$$(cat /secrets/updater_token)"; exec node server.js
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro
      - xiro_secrets:/secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    container_name: xiro_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from https://xiro.pro --to http://backend:3000
    depends_on:
      - backend
    networks:
      - xiro_internal

# xiro_secrets: contraseñas y claves generadas; haz copia de seguridad y no lo borres con «down -v».
# caddy_*: certificados y configuración de Caddy
volumes:
  xiro_secrets:
  caddy_data:
  caddy_config:
