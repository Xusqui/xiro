# Monitorización de Xiro!: Prometheus, Alertmanager, Grafana y exporters.
#
# Se añade al compose principal (mismo proyecto y misma red interna):
#   docker compose -f docker-compose.yml -f monitoring/docker-compose.monitoring.yml up -d
#   (o ./manage.sh monitoring up)
# Las rutas relativas parten de la carpeta del primer fichero (la raíz del repo).
# Guía, SLO y variables: monitoring/README.md

services:
  # El backend expone /metrics en un puerto interno que no se publica en el host.
  backend:
    environment:
      METRICS_PORT: 9464
      METRICS_TOKEN: ${METRICS_TOKEN:-}

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: xiro_prometheus
    restart: unless-stopped
    mem_limit: 768m
    networks: [xiro_internal]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-4GB}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - ./monitoring/secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    logging: &monitoring_logging
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: xiro_alertmanager
    restart: unless-stopped
    mem_limit: 128m
    networks: [xiro_internal]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    logging: *monitoring_logging

  grafana:
    image: grafana/grafana:11.3.0
    container_name: xiro_grafana
    restart: unless-stopped
    mem_limit: 256m
    networks: [xiro_internal]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
    ports:
      # 127.0.0.1 por defecto; GRAFANA_BIND=0.0.0.0 para abrirlo a la LAN.
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    logging: *monitoring_logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: xiro_node_exporter
    restart: unless-stopped
    mem_limit: 64m
    networks: [xiro_internal]
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|host/(dev|proc|run|sys|var/lib/docker|volume[0-9]+/@docker)(/.*)?)($|/)
    volumes:
      # Sin «rslave»: el kernel del Synology no admite propagación de montajes.
      - /:/host:ro
      - ./backups/metrics:/textfile:ro
    logging: *monitoring_logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: xiro_cadvisor
    restart: unless-stopped
    mem_limit: 192m
    networks: [xiro_internal]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Synology guarda los datos de Docker en /volume1/@docker; en otro Linux, /var/lib/docker.
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:/var/lib/docker:ro
    logging: *monitoring_logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: xiro_postgres_exporter
    restart: unless-stopped
    mem_limit: 64m
    networks: [xiro_internal]
    environment:
      DATA_SOURCE_URI: db:${DB_PORT:-5439}/${DB_NAME:-xiro_db}?sslmode=disable
      # Usa el usuario de la app; para un rol de solo lectura con pg_monitor, ver README.
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    depends_on: [db]
    logging: *monitoring_logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: xiro_redis_exporter
    restart: unless-stopped
    mem_limit: 64m
    networks: [xiro_internal]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [redis]
    logging: *monitoring_logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: xiro_blackbox_exporter
    restart: unless-stopped
    mem_limit: 64m
    networks: [xiro_internal]
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    logging: *monitoring_logging

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
