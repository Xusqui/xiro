# Reglas de registro: ratios del SLO y percentiles ya calculados para alertas y
# paneles. Las sondas (/live, /ready) no cuentan para el SLO.
# Las rutas lentas a propósito (IA, subidas, PDF, importación con descargas) no
# cuentan para la latencia: tienen sus propios tiempos de espera.
groups:
  - name: xiro-http-slo
    rules:
      - record: xiro:http_requests:rate5m
        expr: sum(rate(xiro_http_request_duration_seconds_count{job="xiro-backend",route!~"/live|/ready"}[5m]))

      - record: xiro:http_errors:ratio_rate5m
        expr: |
          sum(rate(xiro_http_request_duration_seconds_count{job="xiro-backend",route!~"/live|/ready",status_code=~"5.."}[5m]))
          / sum(rate(xiro_http_request_duration_seconds_count{job="xiro-backend",route!~"/live|/ready"}[5m]))
      - record: xiro:http_errors:ratio_rate30m
        expr: |
          sum(rate(xiro_http_request_duration_seconds_count{job="xiro-backend",route!~"/live|/ready",status_code=~"5.."}[30m]))
          / sum(rate(xiro_http_request_duration_seconds_count{job="xiro-backend",route!~"/live|/ready"}[30m]))
      - record: xiro:http_errors:ratio_rate6h
        expr: |
          sum(rate(xiro_http_request_duration_seconds_count{job="xiro-backend",route!~"/live|/ready",status_code=~"5.."}[6h]))
          / sum(rate(xiro_http_request_duration_seconds_count{job="xiro-backend",route!~"/live|/ready"}[6h]))

      - record: xiro:http_request_duration_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (le) (rate(xiro_http_request_duration_seconds_bucket{job="xiro-backend",route!~"/live|/ready|/api/ai-generator/.*|/api/upload|/api/uploads/cleanup|/api/custom-games/:id/export-pdf|/api/canvas-slides/import"}[5m])))
      - record: xiro:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(xiro_http_request_duration_seconds_bucket{job="xiro-backend",route!~"/live|/ready|/api/ai-generator/.*|/api/upload|/api/uploads/cleanup|/api/custom-games/:id/export-pdf|/api/canvas-slides/import"}[5m])))
      - record: xiro:http_request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(xiro_http_request_duration_seconds_bucket{job="xiro-backend",route!~"/live|/ready|/api/ai-generator/.*|/api/upload|/api/uploads/cleanup|/api/custom-games/:id/export-pdf|/api/canvas-slides/import"}[5m])))
      - record: xiro:http_request_duration_seconds:p99_5m:by_route
        expr: histogram_quantile(0.99, sum by (le, route) (rate(xiro_http_request_duration_seconds_bucket{job="xiro-backend",route!~"/live|/ready"}[5m])))

  - name: xiro-realtime
    rules:
      - record: xiro:socket_events:rate5m
        expr: sum by (event) (rate(xiro_socket_events_total{job="xiro-backend"}[5m]))
      - record: xiro:commands:rate5m
        expr: sum by (command) (rate(xiro_command_duration_seconds_count{job="xiro-backend"}[5m]))
      - record: xiro:command_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le, command) (rate(xiro_command_duration_seconds_bucket{job="xiro-backend"}[5m])))
      - record: xiro:command_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (le, command) (rate(xiro_command_duration_seconds_bucket{job="xiro-backend"}[5m])))
      - record: xiro:command_errors:ratio_rate5m
        expr: |
          sum by (command) (rate(xiro_command_duration_seconds_count{job="xiro-backend",outcome="error"}[5m]))
          / sum by (command) (rate(xiro_command_duration_seconds_count{job="xiro-backend"}[5m]))

  - name: xiro-database
    rules:
      - record: xiro:db_query_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (le, kind) (rate(xiro_db_query_duration_seconds_bucket{job="xiro-backend"}[5m])))
      - record: xiro:db_query_errors:ratio_rate5m
        expr: |
          sum(rate(xiro_db_query_duration_seconds_count{job="xiro-backend",outcome="error"}[5m]))
          / sum(rate(xiro_db_query_duration_seconds_count{job="xiro-backend"}[5m]))
