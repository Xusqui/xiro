# Prometheus de Xiro!. Todos los objetivos están en la red interna de Docker.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    app: xiro

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Un scrape devuelve todos los workers PM2 (etiqueta «worker»): ver
  # app/infrastructure/observability/cluster-metrics.js
  - job_name: xiro-backend
    static_configs:
      - targets: ["backend:9464"]
    # Con METRICS_TOKEN en .env: guarda el mismo valor en monitoring/secrets/metrics_token
    # y descomenta estas dos líneas.
    # authorization:
    #   credentials_file: /etc/prometheus/secrets/metrics_token

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 60s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Solo los contenedores con nombre (descarta cgroups sueltos del sistema)
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Comprobación interna: /ready responde 200 solo si BD y Socket.IO están bien.
  - job_name: blackbox-internal
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets: ["http://backend:3000/ready"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Comprobación desde fuera: HTTPS público (disponibilidad y caducidad del certificado).
  # Edita targets/https.yml con tu dominio.
  - job_name: blackbox-https
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [https_public]
    file_sd_configs:
      - files: [/etc/prometheus/targets/https.yml]
    relabel_configs: *blackbox_relabel
