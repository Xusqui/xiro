# Redis tuned for low-latency UDS and RDB snapshots
port 6379
# bind 0.0.0.0: con red bridge xiro_internal, el puerto TCP no está publicado al host.
# Solo contenedores en xiro_internal pueden alcanzar Redis vía TCP.
# La conexión principal del backend usa el Unix socket; este bind es para
# herramientas de diagnóstico (redis-cli desde el propio contenedor).
bind 0.0.0.0
protected-mode yes
unixsocket /var/run/redis/redis.sock
unixsocketperm 770

# Conexiones Redis por worker PM2:
#   1 x config/redis.js (cliente compartido)
#   2 x RedisSyncBus (syncPub + syncSub via .duplicate())
#   Total: 3 conexiones/worker x 4 workers = 12 conexiones mínimo
#   Se establece 100 como margen cómodo para picos y herramientas externas.
maxclients 100

# Persist every 60 seconds if at least 1 key changed
save 60 1
stop-writes-on-bgsave-error yes
appendonly no

dir /data

# Logging
loglevel notice
logfile /app/logs/redis.log
