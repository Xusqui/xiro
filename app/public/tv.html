<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>XIRO! - Presentador Ultra-Lite</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/tv.css?v=20260921182204">
    <script src="/socket.io/socket.io.js?v=20260921182204"></script>
    <script>
        function getOrCreatePlayerId() { var a = localStorage.getItem('xiro_presenter_playerId'); if (!a) { a = generateUUID(); localStorage.setItem('xiro_presenter_playerId', a) } return a }
        function generateUUID() { var d = new Date().getTime(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = (d + Math.random() * 16) % 16 | 0; d = Math.floor(d / 16); return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16) }) }
        var presenterPlayerId = getOrCreatePlayerId();
    </script>
    <!-- tv.html debe funcionar en WebOS 3.5 (motor JS muy antiguo, sin ES6+).       -->
    <!-- i18n-core.js/i18n-dom.js/i18n-ui.js usan sintaxis moderna (const/let,       -->
    <!-- arrow functions, ?., ??, async/await) que esos motores no pueden parsear,   -->
    <!-- y un SyntaxError ahí puede dejar la pantalla en negro sin cargar nada.      -->
    <!-- Por eso NO se cargan aquí: solo los stubs ES5 en fichero externo (permitido -->
    <!-- por CSP 'self'; un bloque inline lo bloquearía el script-src por hashes).   -->
    <!-- El resto de tv-*.js ya comprueba window.XiroI18n antes de usarlo (ver       -->
    <!-- tv-utils.js, tv-render-players.js, tv-podio.js) y cae al español embebido.  -->
    <script src="/js/core/i18n-stubs.js?v=20260921182204"></script>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><span data-i18n="tv.sidebar.connected">CONECTADOS:</span> <span
                id="sidebar-count">0</span></div>
        <div class="sidebar-content" id="sidebar-list">
            <div style="color:#999;font-style:italic;text-align:center;padding:20px 10px;font-size:11px"
                data-i18n="presenter.lobby.waiting">Esperando jugadores...</div>
        </div>
    </div>
    <div class="main-content">
        <div class="container" id="main-container"></div>
    </div>
    <div id="countdown-overlay" class="countdown-overlay hidden">
        <span id="countdown-number" class="countdown-number"></span>
    </div>
    <div id="ctrl-partida" style="display:none;position:fixed;bottom:35px;left:10px;z-index:1000;">
        <button data-tv-action="finalizar-juego" data-i18n="tv.game.end"
            style="display:inline-block;margin-right:10px;padding:8px 14px;background:#f97316;color:#fff;border:none;border-radius:8px;font-family:Arial,sans-serif;font-size:13px;font-weight:700;cursor:pointer;">Finalizar
            partida</button>
        <button data-tv-action="abortar-juego" data-i18n="tv.game.abort"
            style="display:inline-block;padding:8px 14px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-family:Arial,sans-serif;font-size:13px;font-weight:700;cursor:pointer;">Abortar
            partida</button>
    </div>
    <footer style="position:fixed;bottom:5px;left:5px;color:#666;font-size:10px;z-index:9999">
        <a href="/about.html" style="color:inherit;text-decoration:underline;" title="Acerca de XIRO!"
            data-i18n="common.footer.author">Copyright: Familia Fernández Villatoro</a>
    </footer>
    <script src="/js/tv/tv-state.js?v=20260921182204"></script>
    <script src="/js/tv/tv-utils.js?v=20260921182204"></script>
    <script src="/js/tv/tv-tolerance.js?v=20260921182204"></script>
    <script src="/js/tv/tv-audio.js?v=20260921182204"></script>
    <script src="/js/tv/tv-render-slides.js?v=20260921182204"></script>
    <script src="/js/tv/tv-render-players.js?v=20260921182204"></script>
    <script src="/js/tv/tv-render-question.js?v=20260921182204"></script>
    <script src="/js/tv/tv-teams.js?v=20260921182204"></script>
    <script src="/js/tv/tv-lobby.js?v=20260921182204"></script>
    <!-- Lógica compartida del tablero Trivial (sin módulos, compatible Chrome 40+) -->
    <script src="/js/shared/trivial/trivial-board-geometry.js?v=20260921182204"></script>
    <script src="/js/shared/trivial/trivial-board-builder.js?v=20260921182204"></script>
    <script src="/js/shared/trivial/trivial-token-renderer.js?v=20260921182204"></script>
    <script src="/js/shared/trivial/trivial-highlights-renderer.js?v=20260921182204"></script>
    <script src="/js/tv/tv-trv-state.js?v=20260921182204"></script>
    <script src="/js/tv/tv-trv-layout.js?v=20260921182204"></script>
    <script src="/js/tv/tv-trv-board.js?v=20260921182204"></script>
    <script src="/js/tv/tv-trv-tokens.js?v=20260921182204"></script>
    <script src="/js/tv/tv-trv-highlights.js?v=20260921182204"></script>
    <script src="/js/tv/tv-trv-socket.js?v=20260921182204"></script>
    <script src="/js/tv/tv-socket-connection.js?v=20260921182204"></script>
    <script src="/js/tv/tv-socket-game.js?v=20260921182204"></script>

</body>

</html>
