<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="XIRO! — Juego de Preguntas y Respuestas en Tiempo Real">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0b1210"/>
      <stop offset="60%"  stop-color="#122518"/>
      <stop offset="100%" stop-color="#1a3322"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#8ab817"/>
      <stop offset="60%"  stop-color="#a8d020"/>
      <stop offset="100%" stop-color="#f9b518"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4f5c0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGrad)" rx="10"/>

  <!-- Decorative ambient circles -->
  <circle cx="1160" cy="140" r="130" fill="#8ab817" fill-opacity="0.04"/>
  <circle cx="1160" cy="140" r="85"  fill="#8ab817" fill-opacity="0.05"/>
  <circle cx="55"   cy="270" r="95"  fill="#8ab817" fill-opacity="0.03"/>
  <circle cx="600"  cy="-10" r="160" fill="#f9b518" fill-opacity="0.015"/>

  <!-- Top accent stripe -->
  <rect x="0"   y="0"   width="1200" height="7" fill="url(#stripe)" rx="3"/>
  <!-- Bottom accent stripe -->
  <rect x="0"   y="273" width="1200" height="7" fill="url(#stripe)" rx="3"/>
  <!-- Left accent bar -->
  <rect x="62"  y="46"  width="6"    height="188" fill="url(#stripe)" rx="3"/>

  <!-- XIRO! main title -->
  <text x="88" y="163"
        font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="112"
        font-weight="900"
        fill="url(#titleGrad)"
        letter-spacing="-2">XIRO!</text>

  <!-- Subtitle -->
  <text x="90" y="197"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        fill="#CEE9C9"
        letter-spacing="2.5">Juego de Preguntas y Respuestas en Tiempo Real</text>

  <!-- Divider line -->
  <rect x="90" y="207" width="560" height="3" fill="url(#stripe)" rx="1.5"/>

  <!-- Tech stack tags -->
  <text x="90" y="236"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13.5"
        fill="#8ab817"
        fill-opacity="0.85"
        letter-spacing="0.3">Node.js 20  ·  Socket.IO  ·  PostgreSQL 15  ·  Redis 8  ·  Docker  ·  Tailwind CSS  ·  PM2</text>

  <!-- Right-side decorative label -->
  <text x="910" y="115"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#CEE9C9"
        fill-opacity="0.45"
        text-anchor="middle"
        letter-spacing="1">TIPOS DE PREGUNTAS</text>

  <!-- Kahoot-style answer boxes — row 1 -->
  <rect x="800" y="128" width="50" height="44" rx="7" fill="#e74c3c" fill-opacity="0.82"/>
  <rect x="864" y="128" width="50" height="44" rx="7" fill="#3498db" fill-opacity="0.82"/>
  <rect x="928" y="128" width="50" height="44" rx="7" fill="#f9b518" fill-opacity="0.88"/>
  <rect x="992" y="128" width="50" height="44" rx="7" fill="#8ab817" fill-opacity="0.88"/>

  <!-- Kahoot-style answer boxes — row 2 -->
  <rect x="800" y="184" width="50" height="44" rx="7" fill="#9b59b6" fill-opacity="0.78"/>
  <rect x="864" y="184" width="50" height="44" rx="7" fill="#e74c3c" fill-opacity="0.70"/>
  <rect x="928" y="184" width="50" height="44" rx="7" fill="#3498db" fill-opacity="0.70"/>
  <rect x="992" y="184" width="50" height="44" rx="7" fill="#f9b518" fill-opacity="0.80"/>

  <!-- Labels inside boxes — row 1 -->
  <text x="825" y="156" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">quiz</text>
  <text x="889" y="156" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">survey</text>
  <text x="953" y="153" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">numeric</text>
  <text x="953" y="165" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">approx.</text>
  <text x="1017" y="153" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="white" text-anchor="middle">word</text>
  <text x="1017" y="165" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="white" text-anchor="middle">scramble</text>

  <!-- Labels inside boxes — row 2 -->
  <text x="825" y="209" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">multiple</text>
  <text x="825" y="221" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">choice</text>
  <text x="889" y="209" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="white" text-anchor="middle">order</text>
  <text x="953" y="212" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🎲</text>
  <text x="1017" y="212" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🏆</text>
</svg>
