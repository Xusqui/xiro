    <radialGradient id="head" cx="0.4" cy="0.38" r="0.68" fx="0.32" fy="0.28">
      <stop offset="0" stop-color="#ff9a8f"/>
      <stop offset="0.35" stop-color="#f23b2e"/>
      <stop offset="0.8" stop-color="#c3140c"/>
      <stop offset="1" stop-color="#8a0a05"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a0a05"/>
      <stop offset="0.3" stop-color="#e8352a"/>
      <stop offset="0.45" stop-color="#ff7b70"/>
      <stop offset="0.7" stop-color="#d0180e"/>
      <stop offset="1" stop-color="#7a0804"/>
    </linearGradient>
