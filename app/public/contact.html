<!DOCTYPE html>
<html lang="es" class="page-index">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiRo! - Contacto</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/common.css?v=20260922172926">
    <link rel="stylesheet" href="./css/output-index.css?v=20260922172926">
    <link rel="stylesheet" href="./css/index-style.css?v=20260922172926">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <script src="/js/i18n/i18n-core.js?v=20260922172926"></script>
    <script src="/js/i18n/i18n-dom.js?v=20260922172926"></script>
    <script src="/js/i18n/i18n-ui.js?v=20260922172926"></script>
</head>

<body
    class="bg-gradient-to-br from-plum-700 via-plum-600 to-aubergine-700 min-h-screen flex flex-col items-center justify-center font-sans text-white p-4">
    <a href="#main-content" class="skip-link" data-i18n="common.skip_link">Saltar al contenido</a>
    <canvas id="webgl-canvas"></canvas>

    <main id="main-content" class="w-full max-w-6xl text-center" style="position:relative;z-index:1;">

        <!-- Logo -->
        <div class="flex items-center justify-center gap-8 mb-10">
            <a href="./index.html">
                <img src="./images/logo.svg" alt="XiRo!" class="h-16"
                    style="filter: drop-shadow(3px 3px 1px rgb(0 0 0 / 0.5));">
            </a>
        </div>

        <h1 class="jungle-veil inline-block px-4 py-2 text-3xl md:text-4xl font-black mb-2 drop-shadow-lg" data-i18n="contact.title">...</h1>
        <p class="jungle-veil w-fit mx-auto px-4 py-2 text-lg mb-10 font-medium" data-i18n="contact.subtitle">...</p>

        <!-- Formulario -->
        <div class="max-w-2xl mx-auto">
            <div style="background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);"
                class="rounded-3xl shadow-2xl p-8 md:p-10 text-slate-800 border-b-8 border-plum-500 text-left">

                <!-- Estado: error -->
                <div id="error-msg"
                    class="hidden bg-red-50 border-2 border-red-200 rounded-2xl p-4 mb-6 text-red-700 font-medium text-sm">
                </div>

                <!-- Estado: éxito -->
                <div id="success-msg" class="hidden text-center py-8">
                    <div class="text-6xl mb-4">🎉</div>
                    <h2 class="text-2xl font-black text-green-600 mb-2" data-i18n="contact.success.title">...</h2>
                    <p class="text-slate-600 mb-6"><span data-i18n="contact.success.message">...</span>
                        <span id="reply-email" class="font-bold text-plum-700"></span>.
                    </p>
                    <a href="./index.html"
                        class="inline-flex items-center gap-2 bg-plum-600 text-white font-bold px-6 py-3 rounded-2xl hover:bg-plum-700 transition">
                        <i class="fas fa-home"></i> <span data-i18n="common.back_home">...</span>
                    </a>
                </div>

                <!-- Formulario -->
                <form id="contact-form" class="space-y-5" novalidate>

                    <!-- Honeypot: humanos no lo ven, bots lo rellenan -->
                    <div style="position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none;"
                        aria-hidden="true">
                        <label for="website">Website</label>
                        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                    </div>

                    <div>
                        <label class="block text-slate-700 font-bold mb-1 text-sm" for="cnt-name">
                            <span data-i18n="contact.form.name">...</span> <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="cnt-name" name="name" required maxlength="100"
                            class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-plum-500 focus:ring-2 focus:ring-offset-2 focus:ring-plum-500 transition"
                            placeholder="Tu nombre" data-i18n-placeholder="contact.form.name.placeholder">
                    </div>

                    <div>
                        <label class="block text-slate-700 font-bold mb-1 text-sm" for="cnt-email">
                            <span data-i18n="contact.form.email">...</span> <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="cnt-email" name="email" required maxlength="200"
                            class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-plum-500 focus:ring-2 focus:ring-offset-2 focus:ring-plum-500 transition"
                            placeholder="tu@email.com">
                    </div>

                    <div>
                        <label class="block text-slate-700 font-bold mb-1 text-sm" for="cnt-message">
                            <span data-i18n="contact.form.message">...</span> <span class="text-red-500">*</span>
                        </label>
                        <textarea id="cnt-message" name="message" required maxlength="5000" rows="5"
                            class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-plum-500 focus:ring-2 focus:ring-offset-2 focus:ring-plum-500 transition resize-none"
                            placeholder="¿En qué podemos ayudarte?"
                            data-i18n-placeholder="contact.form.message.placeholder"></textarea>
                    </div>

                    <label class="flex items-start gap-2 text-sm text-slate-700" for="cnt-privacy">
                        <input type="checkbox" id="cnt-privacy" name="privacyAccepted" class="w-5 h-5 mt-1 flex-shrink-0" required>
                        <span data-i18n-html="contact.form.privacy_html">He leído y acepto la <a class="underline font-bold" href="/legal/privacidad.html" target="_blank" rel="noopener">política de privacidad</a>. Usaremos tus datos solo para responderte.</span>
                    </label>

                    <!-- Desafío matemático (antibot) -->
                    <div class="bg-plum-50 rounded-2xl p-4 border-2 border-plum-100">
                        <label class="block text-slate-700 font-bold mb-2 text-sm" for="cnt-captcha">
                            <i class="fas fa-shield-alt text-plum-500 mr-1"></i>
                            <span data-i18n="contact.form.verification">...</span>
                            <span id="captcha-question" class="text-plum-700">Cargando...</span>
                        </label>
                        <input type="number" id="cnt-captcha" name="captcha" required
                            class="w-32 border-2 border-plum-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-plum-500 focus:ring-2 focus:ring-offset-2 focus:ring-plum-500 transition"
                            placeholder="Respuesta" data-i18n-placeholder="contact.form.captcha.placeholder">
                    </div>

                    <input type="hidden" id="contact-token" name="token">

                    <button type="submit" id="submit-btn"
                        class="w-full bg-plum-600 hover:bg-plum-700 text-white font-black text-lg py-4 rounded-2xl transition hover:-translate-y-1 shadow-lg hover:shadow-xl disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0">
                        <i class="fas fa-paper-plane mr-2"></i><span data-i18n="contact.form.submit">...</span>
                    </button>
                </form>
            </div>

            <!-- Volver -->
            <div class="jungle-veil p-4 mt-8 text-sm space-y-2">
                <p>
                    <a href="./index.html" class="hover:text-white transition-colors underline underline-offset-2">
                        <i class="fas fa-arrow-left mr-1"></i><span data-i18n="common.back_home">...</span>
                    </a>
                </p>
                <p><span data-i18n="common.footer.copyright">...</span><span class="xiro-app-version"></span></p>
                <p class="text-xs mt-2" data-legal-links></p>
            </div>
        </div>
    </main>

    <img src="./images/chamaleon/hello.svg" alt="" class="player-chameleon">

    <script src="/js/core/contact-form.js?v=20261109120000"></script>
    <script src="/js/core/site-badge.js?v=20260922172926"></script>
    <script src="/js/core/app-version.js?v=20260922172926"></script>
    <script src="/js/core/hojas-bg.js?v=20260922172926"></script>
    <script src="/js/core/legal-links.js?v=20261109120000"></script>
</body>

</html>
