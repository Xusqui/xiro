<!DOCTYPE html>
<html lang="es" class="page-index">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIRO! - Contacto</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/common.css?v=20260627190802">
    <link rel="stylesheet" href="./css/output-index.css?v=20260627190802">
    <link rel="stylesheet" href="./css/index-style.css?v=20260627190802">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <script defer src="/js/core/umami-loader.js?v=20260627190802"></script>
    <script src="/js/i18n/i18n-core.js?v=20260627190802"></script>
    <script src="/js/i18n/i18n-dom.js?v=20260627190802"></script>
    <script src="/js/i18n/i18n-ui.js?v=20260627190802"></script>
</head>

<body
    class="bg-gradient-to-br from-purple-700 via-purple-600 to-indigo-700 min-h-screen flex flex-col items-center justify-center font-sans text-white p-4">
    <canvas id="webgl-canvas"></canvas>

    <div class="w-full max-w-6xl text-center" style="position:relative;z-index:1;">

        <!-- Logo -->
        <div class="flex items-center justify-center gap-8 mb-10">
            <a href="./index.html">
                <img src="./images/logo.svg" alt="XIRO! Logo" class="h-16"
                    style="filter: drop-shadow(3px 3px 1px rgb(0 0 0 / 0.5));">
            </a>
        </div>

        <h1 class="text-3xl md:text-4xl font-black mb-2 text-white drop-shadow-lg" data-i18n="contact.title">...</h1>
        <p class="text-lg mb-10 text-purple-100 font-medium" data-i18n="contact.subtitle">...</p>

        <!-- Formulario -->
        <div class="max-w-2xl mx-auto">
            <div style="background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);"
                class="rounded-3xl shadow-2xl p-8 md:p-10 text-slate-800 border-b-8 border-purple-500 text-left">

                <!-- Estado: error -->
                <div id="error-msg"
                    class="hidden bg-red-50 border-2 border-red-200 rounded-2xl p-4 mb-6 text-red-700 font-medium text-sm">
                </div>

                <!-- Estado: éxito -->
                <div id="success-msg" class="hidden text-center py-8">
                    <div class="text-6xl mb-4">🎉</div>
                    <h2 class="text-2xl font-black text-green-600 mb-2" data-i18n="contact.success.title">...</h2>
                    <p class="text-slate-600 mb-6"><span data-i18n="contact.success.message">...</span>
                        <span id="reply-email" class="font-bold text-purple-700"></span>.
                    </p>
                    <a href="./index.html"
                        class="inline-flex items-center gap-2 bg-purple-600 text-white font-bold px-6 py-3 rounded-2xl hover:bg-purple-700 transition">
                        <i class="fas fa-home"></i> <span data-i18n="common.back_home">...</span>
                    </a>
                </div>

                <!-- Formulario -->
                <form id="contact-form" class="space-y-5" novalidate>

                    <!-- Honeypot: humanos no lo ven, bots lo rellenan -->
                    <div style="position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none;"
                        aria-hidden="true">
                        <label for="website">Website</label>
                        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                    </div>

                    <div>
                        <label class="block text-slate-700 font-bold mb-1 text-sm" for="cnt-name">
                            <span data-i18n="contact.form.name">...</span> <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="cnt-name" name="name" required maxlength="100"
                            class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-purple-400 transition"
                            placeholder="Tu nombre" data-i18n-placeholder="contact.form.name.placeholder">
                    </div>

                    <div>
                        <label class="block text-slate-700 font-bold mb-1 text-sm" for="cnt-email">
                            <span data-i18n="contact.form.email">...</span> <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="cnt-email" name="email" required maxlength="200"
                            class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-purple-400 transition"
                            placeholder="tu@email.com">
                    </div>

                    <div>
                        <label class="block text-slate-700 font-bold mb-1 text-sm" for="cnt-message">
                            <span data-i18n="contact.form.message">...</span> <span class="text-red-500">*</span>
                        </label>
                        <textarea id="cnt-message" name="message" required maxlength="5000" rows="5"
                            class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-purple-400 transition resize-none"
                            placeholder="¿En qué podemos ayudarte?"
                            data-i18n-placeholder="contact.form.message.placeholder"></textarea>
                    </div>

                    <!-- Desafío matemático (antibot) -->
                    <div class="bg-purple-50 rounded-2xl p-4 border-2 border-purple-100">
                        <label class="block text-slate-700 font-bold mb-2 text-sm" for="cnt-captcha">
                            <i class="fas fa-shield-alt text-purple-500 mr-1"></i>
                            <span data-i18n="contact.form.verification">...</span>
                            <span id="captcha-question" class="text-purple-700">Cargando...</span>
                        </label>
                        <input type="number" id="cnt-captcha" name="captcha" required
                            class="w-32 border-2 border-purple-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:border-purple-400 transition"
                            placeholder="Respuesta" data-i18n-placeholder="contact.form.captcha.placeholder">
                    </div>

                    <input type="hidden" id="contact-token" name="token">

                    <button type="submit" id="submit-btn"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black text-lg py-4 rounded-2xl transition-all hover:-translate-y-1 shadow-lg hover:shadow-xl disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0">
                        <i class="fas fa-paper-plane mr-2"></i><span data-i18n="contact.form.submit">...</span>
                    </button>
                </form>
            </div>

            <!-- Volver -->
            <div class="mt-8 text-purple-200 text-sm space-y-2">
                <p>
                    <a href="./index.html" class="hover:text-white transition-colors underline underline-offset-2">
                        <i class="fas fa-arrow-left mr-1"></i><span data-i18n="common.back_home">...</span>
                    </a>
                </p>
                <p data-i18n="common.footer.copyright">...</p>
            </div>
        </div>
    </div>

    <img src="./images/chamaleon/hello.svg" alt="Camaleón" class="player-chameleon">

    <script>
        (function () {
            var form = document.getElementById('contact-form');
            var tokenInput = document.getElementById('contact-token');
            var questionEl = document.getElementById('captcha-question');
            var submitBtn = document.getElementById('submit-btn');
            var errorMsg = document.getElementById('error-msg');
            var successMsg = document.getElementById('success-msg');

            function loadToken() {
                fetch('/api/contact/token')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        tokenInput.value = data.token;
                        questionEl.textContent = data.question;
                    })
                    .catch(function () {
                        questionEl.textContent = 'Error al cargar. Recarga la página.';
                    });
            }

            loadToken();

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                errorMsg.classList.add('hidden');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Enviando...';

                var payload = {
                    name: document.getElementById('cnt-name').value,
                    email: document.getElementById('cnt-email').value,
                    message: document.getElementById('cnt-message').value,
                    captcha: document.getElementById('cnt-captcha').value,
                    token: tokenInput.value,
                    website: document.getElementById('website').value
                };

                fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                    .then(function (r) {
                        return r.json().then(function (d) { return { ok: r.ok, data: d }; });
                    })
                    .then(function (res) {
                        if (res.ok) {
                            form.classList.add('hidden');
                            document.getElementById('reply-email').textContent = payload.email;
                            successMsg.classList.remove('hidden');
                        } else {
                            errorMsg.textContent = res.data.error || 'Error al enviar. Inténtalo de nuevo.';
                            errorMsg.classList.remove('hidden');
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Enviar mensaje';
                            loadToken();
                            document.getElementById('cnt-captcha').value = '';
                        }
                    })
                    .catch(function () {
                        errorMsg.textContent = 'Error de conexión. Comprueba tu red e inténtalo de nuevo.';
                        errorMsg.classList.remove('hidden');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Enviar mensaje';
                    });
            });
        })();
    </script>
    <script src="/js/core/site-badge.js?v=20260627190802"></script>
</body>

</html>
