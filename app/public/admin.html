<body class="admin-console bg-slate-100 text-slate-800">

    <div id="login-overlay" class="fixed inset-0 flex items-center justify-center z-50 p-4">

        <!-- Selva de la portada (degradado en admin-login.css + hojas estáticas) -->
        <img src="/images/hojas3.svg" alt="" aria-hidden="true" class="xiro-login-leaves">

        <div class="xiro-login-wrap">

        <img src="/images/chamaleon/detective.svg" alt="" aria-hidden="true" class="xiro-detective" width="128"

        <!-- Card -->
        <div class="xiro-login-card w-full relative">
            <div class="xiro-login-accent-bar"></div>
            <div class="xiro-login-inner flex flex-col items-center gap-5">

                <!-- Logo -->
                <a href="/index.html" class="cursor-pointer block">

                </a>

                <!-- Heading -->
                <div style="width:100%">
                    <p class="xiro-login-eyebrow" data-i18n="admin.login.eyebrow">...</p>
                    <h1 id="login-card-title" class="xiro-login-title" tabindex="-1" data-i18n="admin.login.title">...</h1>
                </div>

                <!-- Login Form -->
                <form id="admin-login-form" class="w-full flex flex-col gap-3">
                    <div class="xiro-input-wrap">
                        <input type="text" id="admin-username" class="xiro-login-input" aria-label="Usuario" data-i18n-aria-label="admin.login.username" placeholder="Usuario"
                            data-i18n-placeholder="admin.login.username" autocomplete="username" spellcheck="false"
                            autocapitalize="off" required>
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="xiro-input-wrap">
                        <input type="password" id="admin-password" class="xiro-login-input" aria-label="Contraseña" data-i18n-aria-label="admin.login.password" placeholder="Contraseña"
                            data-i18n-placeholder="admin.login.password" autocomplete="current-password" required>
                        <button type="button" class="xiro-reveal-toggle" data-reveal-target="admin-password"
                            aria-pressed="false" data-i18n-aria-label="admin.login.password_show"
                            aria-label="Mostrar contraseña">
                            <svg class="xiro-reveal-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
                                focusable="false">
                                <path d="M3 12C6 7.2 9 5.2 12 5.2s6 2 9 6.8c-3 4.8-6 6.8-9 6.8s-6-2-9-6.8Z" fill="none"
                                    stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                                <rect class="xiro-reveal-pupil" x="10.5" y="7.8" width="3" height="8.4" rx="1.5"
                                    fill="currentColor" />
                            </svg>
                        </button>
                    </div>
                    <label class="xiro-login-consent hidden" id="login-terms-row">
                        <input type="checkbox" id="login-accept-terms">
                        <span data-i18n-html="admin.register.accept_terms">Tengo al menos 14 años y acepto los <a href="/legal/terminos.html" target="_blank" rel="noopener">términos</a> y la <a href="/legal/privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.</span>
                    </label>
                    <button type="submit" class="xiro-login-btn">
                        <i class="fas fa-arrow-right" style="margin-right:8px;"></i><span
                            data-i18n="admin.login.submit">...</span>
                    </button>
                    <button type="button" id="admin-forgot-password-btn" class="xiro-login-link text-center text-sm underline" data-i18n="admin.login.forgot_password">...</button>
                    <button type="button" id="admin-register-btn" class="xiro-login-btn-secondary"
                        data-i18n="admin.login.register">...</button>
                    <div id="login-helper" role="status" class="xiro-login-helper text-center text-sm"></div>
                    <div id="login-error" role="alert" class="xiro-login-error hidden text-center text-sm font-semibold"></div>
                </form>

                <!-- Forgot Password Form -->
                <form id="admin-forgot-password-form" class="w-full flex flex-col gap-3 hidden">
                    <div class="xiro-input-wrap">
                        <input type="email" id="forgot-email" class="xiro-login-input" aria-label="Correo electrónico" data-i18n-aria-label="admin.register.email" placeholder="Correo electrónico"

                    </div>
                    <button type="submit" id="forgot-submit-btn" class="xiro-login-btn"
                        data-i18n="admin.forgot.submit">...</button>

                    <div id="forgot-error" role="alert" class="xiro-login-error hidden text-center text-sm font-semibold">
                    </div>
                </form>

                <!-- Reset Password Form -->
                <form id="admin-reset-password-form" class="w-full flex flex-col gap-3 hidden">
                    <div class="xiro-input-wrap">
                        <input type="password" id="reset-new-password" class="xiro-login-input" aria-label="Nueva contraseña" data-i18n-aria-label="admin.reset.new_password"

                                    fill="currentColor" />
                            </svg>

                    </div>
                    <div class="xiro-input-wrap">
                        <input type="password" id="reset-confirm-password" class="xiro-login-input" aria-label="Confirmar nueva contraseña" data-i18n-aria-label="admin.reset.confirm_password"
                            placeholder="Confirmar nueva contraseña"
                            data-i18n-placeholder="admin.reset.confirm_password" autocomplete="new-password" required>
                        <button type="button" class="xiro-reveal-toggle" data-reveal-target="reset-confirm-password"
                            aria-pressed="false" data-i18n-aria-label="admin.login.password_show"
                            aria-label="Mostrar contraseña">
                            <svg class="xiro-reveal-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
                                focusable="false">
                                <path d="M3 12C6 7.2 9 5.2 12 5.2s6 2 9 6.8c-3 4.8-6 6.8-9 6.8s-6-2-9-6.8Z" fill="none"
                                    stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                                <rect class="xiro-reveal-pupil" x="10.5" y="7.8" width="3" height="8.4" rx="1.5"
                                    fill="currentColor" />
                            </svg>

                    </div>
                    <button type="submit" id="reset-submit-btn" class="xiro-login-btn"
                        data-i18n="admin.reset.submit">...</button>
                    <div id="reset-helper" role="status" class="xiro-login-helper text-center text-sm"></div>
                    <div id="reset-error" role="alert" class="xiro-login-error hidden text-center text-sm font-semibold">
                    </div>
                </form>

                <!-- Register Form -->
                <form id="admin-register-form" class="w-full flex flex-col gap-3 hidden">
                    <div class="xiro-input-wrap">
                        <input type="text" id="register-username" class="xiro-login-input" aria-label="Usuario" data-i18n-aria-label="admin.login.username" placeholder="Usuario"

                    <div class="xiro-input-wrap">

                            autocomplete="email" spellcheck="false" autocapitalize="off" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="xiro-input-wrap">
                        <input type="password" id="register-password" class="xiro-login-input" aria-label="Contraseña" data-i18n-aria-label="admin.login.password" placeholder="Contraseña"
                            data-i18n-placeholder="admin.login.password" autocomplete="new-password" required>
                        <button type="button" class="xiro-reveal-toggle" data-reveal-target="register-password"
                            aria-pressed="false" data-i18n-aria-label="admin.login.password_show"
                            aria-label="Mostrar contraseña">
                            <svg class="xiro-reveal-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
                                focusable="false">
                                <path d="M3 12C6 7.2 9 5.2 12 5.2s6 2 9 6.8c-3 4.8-6 6.8-9 6.8s-6-2-9-6.8Z" fill="none"
                                    stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                                <rect class="xiro-reveal-pupil" x="10.5" y="7.8" width="3" height="8.4" rx="1.5"
                                    fill="currentColor" />
                            </svg>
                        </button>
                    </div>
                    <div class="xiro-input-wrap">
                        <input type="password" id="register-confirm-password" class="xiro-login-input" aria-label="Confirmar contraseña" data-i18n-aria-label="admin.register.confirm"
                            placeholder="Confirmar contraseña" data-i18n-placeholder="admin.register.confirm"
                            autocomplete="new-password" required>
                        <button type="button" class="xiro-reveal-toggle" data-reveal-target="register-confirm-password"
                            aria-pressed="false" data-i18n-aria-label="admin.login.password_show"
                            aria-label="Mostrar contraseña">
                            <svg class="xiro-reveal-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
                                focusable="false">
                                <path d="M3 12C6 7.2 9 5.2 12 5.2s6 2 9 6.8c-3 4.8-6 6.8-9 6.8s-6-2-9-6.8Z" fill="none"
                                    stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                                <rect class="xiro-reveal-pupil" x="10.5" y="7.8" width="3" height="8.4" rx="1.5"
                                    fill="currentColor" />
                            </svg>
                        </button>
                    </div>
                    <label class="xiro-login-consent">
                        <input type="checkbox" id="register-accept-terms" required>
                        <span data-i18n-html="admin.register.accept_terms">Tengo al menos 14 años y acepto los <a href="/legal/terminos.html" target="_blank" rel="noopener">términos</a> y la <a href="/legal/privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.</span>
                    </label>
                    <button type="submit" id="register-submit-btn" class="xiro-login-btn"
                        data-i18n="admin.login.register">...</button>
                    <button type="button" id="register-back-btn" class="xiro-login-btn-secondary"
                        data-i18n="admin.register.back">...</button>
                    <div id="register-helper" role="status" class="xiro-login-helper text-center text-sm"></div>
                    <div id="register-error" role="alert" class="xiro-login-error hidden text-center text-sm font-semibold">

                <!-- Selector de idioma (i18n-ui.js lo monta aquí; tras entrar pasa al sidebar) -->

                <p class="xiro-login-helper text-xs text-center" data-legal-links></p>

    <div id="admin-content" style="display:none">
        <a href="#editorArea" class="skip-link" data-i18n="common.skip_link">Saltar al contenido</a>
        <div id="admin-shell" class="flex h-screen">

                </button>
                <p id="admin-mobile-title" class="admin-mobile-bar__title"></p>
                <button type="button" id="admin-live-shortcut" class="admin-mobile-bar__btn" style="display:none"

            </header>
            <div id="admin-nav-veil" class="admin-nav-veil"></div>

                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <!-- Header con Logo -->
                <div class="admin-sidebar-brand p-6 border-b border-slate-700 flex justify-center">
                    <a href="#" data-admin-action="go-home" class="cursor-pointer">
                        <img src="/images/logo.svg" alt="XiRo!" style="width: 180px;">
                    </a>
                </div>

                        <i class="fas fa-question-circle mr-1"></i><span data-i18n="admin.nav.tab.questions">...</span>
                    </button>
                    <button id="section-tab-user" data-admin-action="switch-section-tab" data-section="user"
                        class="py-2 rounded-lg text-sm font-bold transition text-slate-400 hover:text-white px-3">
                        <i class="fas fa-user mr-1"></i><span data-i18n="admin.nav.tab.user">...</span>
                    </button>
                    <button id="section-tab-config" data-admin-action="switch-section-tab" data-section="config"

                        <i class="fas fa-sliders-h mr-1"></i><span data-i18n="admin.nav.tab.config">...</span>
                    </button>
                </div>

                            <i class="fas fa-house text-lg" aria-hidden="true"></i>
                        </div>
                        <span class="text-sm" data-i18n="admin.home.title">...</span>
