<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="error.401.page.title">401 — No autorizado · XIRO</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/css/common.css?v=20260704213554">
    <style>
        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-18px)
            }
        }

        .mascot-float {
            animation: float 4s ease-in-out infinite;
        }

        .err-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .err-aside {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
        }

        .err-aside img {
            width: 100%;
            max-width: 26rem;
            object-fit: contain;
            max-height: 45vh;
        }

        .err-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3.5rem 2rem;
        }

        .err-code {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .err-title {
            font-size: clamp(1.75rem, 4vw, 3rem);
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 1.5rem;
        }

        .err-desc {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #94a3b8;
            line-height: 1.75;
            margin-bottom: 2.5rem;
            max-width: 28rem;
        }

        .err-actions {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            align-items: center;
        }

        .err-logo {
            margin-top: auto;
            padding-top: 3rem;
            opacity: .6;
        }

        .err-logo img {
            height: 4rem;
        }

        @media (min-width:1024px) {
            .err-wrap {
                flex-direction: row;
            }

            .err-aside {
                width: 50%;
                min-height: 100vh;
                padding: 4rem;
                flex-shrink: 0;
            }

            .err-aside img {
                max-width: none;
                width: 75%;
                max-height: 80vh;
            }

            .err-body {
                width: 50%;
                min-height: 100vh;
                align-items: flex-start;
                text-align: left;
                padding: 4rem 5rem;
            }

            .err-actions {
                align-items: flex-start;
            }
        }
    </style>
    <script src="/js/i18n/i18n-core.js?v=20260704213554"></script>
    <script src="/js/i18n/i18n-dom.js?v=20260704213554"></script>
    <script src="/js/i18n/i18n-ui.js?v=20260704213554"></script>
</head>

<body class="bg-slate-900 font-sans">
    <div class="err-wrap">

        <div class="err-aside" style="background:linear-gradient(135deg,#0c1424 0%,rgba(30,58,138,0.3) 100%)">
            <img src="/images/chamaleon/errors/401.webp" alt="Camaleón XIRO — No autorizado"
                class="mascot-float drop-shadow-2xl">
        </div>

        <div class="err-body">
            <p class="err-code" style="color:#60a5fa" aria-hidden="true">401</p>
            <h1 data-i18n="error.401.heading" class="err-title">No autorizado</h1>
            <p data-i18n-html="error.401.description_html" class="err-desc">
                Esta acción requiere que hayas iniciado sesión.<br>
                Identifícate con tus credenciales de administrador para continuar.
            </p>

            <div
                class="inline-flex items-center gap-2 bg-blue-900/30 border border-blue-500/30 text-blue-400 text-sm px-4 py-2 rounded-lg mb-8">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <span data-i18n="error.401.badge.session_required">Sesión requerida</span>
            </div>

            <div class="err-actions">
                <a href="/"
                    class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-xl transition-all shadow-lg hover:-translate-y-1 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span data-i18n="common.back_home">Volver al inicio</span>
                </a>
            </div>

            <div class="err-logo">
                <img src="/images/logo.svg" alt="XIRO" aria-hidden="true">
            </div>
        </div>

    </div>
    <script src="/js/core/site-badge.js?v=20260704213554"></script>
</body>

</html>
