<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="error.503.page.title">503 — Servicio no disponible · XIRO</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/css/common.css?v=20260822080605">
    <style>
        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-18px)
            }
        }

        .mascot-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 0%
            }

            100% {
                width: 100%
            }
        }

        .progress-bar {
            animation: progress 8s ease-in-out infinite;
        }

        .err-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .err-aside {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
        }

        .err-aside img {
            width: 100%;
            max-width: 26rem;
            object-fit: contain;
            max-height: 45vh;
        }

        .err-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3.5rem 2rem;
        }

        .err-code {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .err-title {
            font-size: clamp(1.75rem, 4vw, 3rem);
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 1.5rem;
        }

        .err-desc {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #94a3b8;
            line-height: 1.75;
            margin-bottom: 2.5rem;
            max-width: 28rem;
        }

        .err-actions {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            align-items: center;
        }

        .err-logo {
            margin-top: auto;
            padding-top: 3rem;
            opacity: .6;
        }

        .err-logo img {
            height: 4rem;
        }

        @media (min-width:1024px) {
            .err-wrap {
                flex-direction: row;
            }

            .err-aside {
                width: 50%;
                min-height: 100vh;
                padding: 4rem;
                flex-shrink: 0;
            }

            .err-aside img {
                max-width: none;
                width: 75%;
                max-height: 80vh;
            }

            .err-body {
                width: 50%;
                min-height: 100vh;
                align-items: flex-start;
                text-align: left;
                padding: 4rem 5rem;
            }

            .err-actions {
                align-items: flex-start;
            }
        }
    </style>
    <script src="/js/i18n/i18n-core.js?v=20260822080605"></script>
    <script src="/js/i18n/i18n-dom.js?v=20260822080605"></script>
    <script src="/js/i18n/i18n-ui.js?v=20260822080605"></script>
</head>

<body class="bg-slate-900 font-sans">
    <div class="err-wrap">

        <div class="err-aside" style="background:linear-gradient(135deg,#120a1e 0%,rgba(88,28,135,0.3) 100%)">
            <img src="/images/chamaleon/errors/503.webp" alt="Camaleón XIRO — Servicio no disponible"
                class="mascot-float drop-shadow-2xl">
        </div>

        <div class="err-body">
            <p class="err-code" style="color:#c084fc" aria-hidden="true">503</p>
            <h1 data-i18n="error.503.heading" class="err-title">Servicio no disponible</h1>
            <p data-i18n-html="error.503.description_html" class="err-desc">
                El servidor está temporalmente fuera de servicio o sobrecargado.<br>
                Espera unos momentos e inténtalo de nuevo.
            </p>

            <!-- Barra de progreso -->
            <div style="width:100%;max-width:20rem;margin-bottom:2.5rem">
                <div style="height:6px;background:#1e293b;border-radius:9999px;overflow:hidden">
                    <div class="progress-bar"
                        style="height:100%;background:linear-gradient(to right,#9333ea,#06b6d4,#9333ea);border-radius:9999px">
                    </div>
                </div>
            </div>

            <div class="err-actions">
                <button data-error-action="reload"
                    class="inline-flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white font-semibold px-8 py-3 rounded-xl transition-all shadow-lg hover:-translate-y-1 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span data-i18n="error.common.retry">Reintentar</span>
                </button>
                <a href="/"
                    class="inline-flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold px-8 py-3 rounded-xl transition-all shadow-lg hover:-translate-y-1 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span data-i18n="common.back_home">Volver al inicio</span>
                </a>
            </div>

            <div class="err-logo">
                <img src="/images/logo.svg" alt="XIRO" aria-hidden="true">
            </div>
        </div>

    </div>
    <script src="/js/error-pages.js?v=20260822080605"></script>
    <script src="/js/core/site-badge.js?v=20260822080605"></script>
</body>

</html>
