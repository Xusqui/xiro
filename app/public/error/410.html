<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="error.410.page.title">410 — Recurso eliminado · XIRO</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/css/common.css?v=20260829205150">
    <style>
        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-18px)
            }
        }

        .mascot-float {
            animation: float 4s ease-in-out infinite;
        }

        .err-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .err-aside {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
        }

        .err-aside img {
            width: 100%;
            max-width: 26rem;
            object-fit: contain;
            max-height: 45vh;
        }

        .err-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3.5rem 2rem;
        }

        .err-code {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .err-title {
            font-size: clamp(1.75rem, 4vw, 3rem);
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 1.5rem;
        }

        .err-desc {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #94a3b8;
            line-height: 1.75;
            margin-bottom: 2.5rem;
            max-width: 28rem;
        }

        .err-actions {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            align-items: center;
        }

        .err-logo {
            margin-top: auto;
            padding-top: 3rem;
            opacity: .6;
        }

        .err-logo img {
            height: 4rem;
        }

        @media (min-width:1024px) {
            .err-wrap {
                flex-direction: row;
            }

            .err-aside {
                width: 50%;
                min-height: 100vh;
                padding: 4rem;
                flex-shrink: 0;
            }

            .err-aside img {
                max-width: none;
                width: 75%;
                max-height: 80vh;
            }

            .err-body {
                width: 50%;
                min-height: 100vh;
                align-items: flex-start;
                text-align: left;
                padding: 4rem 5rem;
            }

            .err-actions {
                align-items: flex-start;
            }
        }
    </style>
    <script src="/js/i18n/i18n-core.js?v=20260829205150"></script>
    <script src="/js/i18n/i18n-dom.js?v=20260829205150"></script>
    <script src="/js/i18n/i18n-ui.js?v=20260829205150"></script>
</head>

<body class="bg-slate-900 font-sans">
    <a href="#main-content" class="skip-link" data-i18n="common.skip_link">Saltar al contenido</a>
    <main id="main-content" class="err-wrap">

        <div class="err-aside" style="background:#1e293b">
            <img src="/images/chamaleon/errors/410.webp" alt="Camaleón XIRO — Recurso eliminado"
                class="mascot-float drop-shadow-2xl">
        </div>

        <div class="err-body">
            <p class="err-code" style="color:#94a3b8" aria-hidden="true">410</p>
            <h1 data-i18n="error.410.heading" class="err-title">Recurso eliminado</h1>
            <p data-i18n-html="error.410.description_html" class="err-desc">
                Esta partida o recurso ya no existe en el servidor.<br>
                Puede que haya expirado o que el administrador lo haya eliminado permanentemente.
            </p>

            <div
                class="inline-flex items-center gap-2 bg-slate-800 border border-slate-700 text-slate-500 text-sm px-4 py-2 rounded-lg mb-8">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span data-i18n="error.410.badge.permanently_deleted">Eliminado permanentemente</span>
            </div>

            <div class="err-actions">
                <a href="/"
                    class="inline-flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white font-semibold px-8 py-3 rounded-xl transition-all shadow-lg hover:-translate-y-1 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span data-i18n="common.back_home">Volver al inicio</span>
                </a>
            </div>

            <div class="err-logo">
                <img src="/images/logo.svg" alt="XIRO" aria-hidden="true">
            </div>
        </div>

    </main>
    <script src="/js/core/site-badge.js?v=20260829205150"></script>
</body>

</html>
