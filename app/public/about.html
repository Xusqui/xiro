    <div id="solo-mascot" class="particle" style="animation-delay:0.4s"><img id="mascot-img" src="" alt=""></div>
    <script>
        (function () {
            var list = ['gamer','albanil','nerd','mago','pirata','jetpack','astronauta',
                        'bailarina','musico','cooking','surfero','yoda','disguise',
                        'detective','party','running','thinking','love'];
            var spots = [
                { top:'12%', right:'3%' }, { top:'30%', right:'2%' },
                { top:'55%', right:'4%' }, { top:'70%', right:'3%' },
                { top:'20%', left:'2%'  }, { top:'45%', left:'3%'  }
            ];
            var el = document.getElementById('solo-mascot');
            var name = list[Math.floor(Math.random() * list.length)];
            var pos  = spots[Math.floor(Math.random() * spots.length)];
            document.getElementById('mascot-img').src = './images/chamaleon/' + name + '.svg';
            Object.assign(el.style, pos);
        })();
