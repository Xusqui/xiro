<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="xiro-i18n-sections" content="common,player">
    <title>XIRO! - Jugador</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/common.css?v=20260829210149">
    <link rel="stylesheet" href="/css/output-player.css?v=20260829210149">
    <link rel="stylesheet" href="/css/jugador-base.css?v=20260829210149">
    <link rel="stylesheet" href="/css/jugador-quiz.css?v=20260829210149">
    <link rel="stylesheet" href="/css/jugador-effects.css?v=20260829210149">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="/socket.io/socket.io.js?v=20260829210149"></script>
    <script defer src="/js/core/umami-loader.js?v=20260829210149"></script>
    <style>
        /* Clases personalizadas para text-fitting dinámico */
        .text-adaptive {
            font-size: clamp(1rem, 4vw, 1.5rem);
            line-height: 1.2;
        }

        .text-adaptive-lg {
            font-size: clamp(1.25rem, 5vw, 2rem);
            line-height: 1.3;
        }

        /* Ajuste dinámico de fuente según longitud del texto */
        .text-responsive-xs {
            font-size: clamp(0.65rem, 2.5vw, 0.75rem);
            line-height: 1.1;
        }

        .text-responsive-sm {
            font-size: clamp(0.75rem, 3vw, 0.875rem);
            line-height: 1.15;
        }

        .text-responsive-base {
            font-size: clamp(0.875rem, 3.5vw, 1rem);
            line-height: 1.2;
        }

        .text-responsive-md {
            font-size: clamp(1rem, 4vw, 1.125rem);
            line-height: 1.25;
        }

        .text-responsive-lg {
            font-size: clamp(1.125rem, 4.5vw, 1.25rem);
            line-height: 1.3;
        }

        /* Animaciones personalizadas */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Evitar selección de texto en botones */
        button {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Configuración de Tailwind personalizada */
        @layer utilities {
            .h-dvh {
                height: 100dvh;
            }

            /* Fallback para navegadores sin soporte dvh */
            @supports not (height: 100dvh) {
                .h-dvh {
                    height: 100vh;
                }
            }
        }
    </style>
    <link rel="stylesheet" href="/css/dice3d.css?v=20260829210149">
    <script defer src="/js/i18n/i18n-core.js?v=20260829210149"></script>
    <script defer src="/js/i18n/i18n-dom.js?v=20260829210149"></script>
    <script defer src="/js/i18n/i18n-ui.js?v=20260829210149"></script>
</head>

<body class="bg-purple-700 h-dvh flex flex-col items-center justify-center font-sans text-white overflow-hidden p-4">

    <div id="main-container" class="w-full max-w-sm text-center">
        <img src="/images/logo.svg" alt="Logo"
            style="width: 100%; max-width: 384px; margin: 0 auto 2rem auto; filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.04));">
        <div id="login-box" class="bg-white p-8 rounded-3xl shadow-2xl text-slate-800 border-b-8 border-gray-200">
            <div id="step-1">
                <h2 class="text-slate-500 font-bold mb-4 uppercase text-sm" data-i18n="player.session.label">...</h2>
                <p class="text-xs text-slate-400 mb-3" data-i18n="player.session.hint">...</p>
                <input type="text" id="session-input" placeholder="XXXXXX-XXXX" autofocus
                    data-i18n-placeholder="player.session.placeholder"
                    class="w-full p-4 mb-4 border-4 border-gray-100 rounded-2xl font-black text-xl text-center focus:border-purple-500 outline-none uppercase">
                <button data-player-action="validar-session" data-i18n="player.session.submit"
                    class="w-full bg-slate-900 text-white p-4 rounded-2xl font-black text-xl">...</button>
            </div>
            <div id="step-loading" class="hidden">
                <div class="flex flex-col items-center gap-4 py-4">
                    <div class="w-10 h-10 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin">
                    </div>
                    <p class="text-slate-500 font-bold uppercase text-sm" data-i18n="player.loading">...</p>
                </div>
            </div>
            <div id="step-2" class="hidden">
                <h2 class="text-slate-500 font-bold mb-4 uppercase text-sm" data-i18n="player.nickname.label">...</h2>
                <input type="text" id="nickname-input" placeholder="NOMBRE" maxlength="15"
                    data-i18n-placeholder="player.nickname.placeholder"
                    class="w-full p-4 mb-4 border-4 border-gray-100 rounded-2xl font-black text-2xl text-center focus:border-purple-500 outline-none uppercase">
                <button data-player-action="join-lobby" data-i18n="player.nickname.submit"
                    class="w-full bg-green-600 text-white p-4 rounded-2xl font-black text-xl">...</button>
            </div>
        </div>
    </div>

    <!-- Carga modular con ES6 modules -->
    <script type="module" src="/js/player/player-main.js?v=20260829210149"></script>
    <script src="/js/core/site-badge.js?v=20260829210149"></script>
    <script src="/js/core/personalization.js?v=20260829210149"></script>
</body>

</html>
